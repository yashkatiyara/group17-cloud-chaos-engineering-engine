id: "03_security_group_partition"
name: "VPC Security Group Partition (Blackhole)"
description: "Simulates accidental firewall ACL or Security Group misconfiguration dropping all inbound network traffic to Inventory Service."
target: "inventory-service"
fault:
  type: "network_partition"
  duration_seconds: 20

steady_state_hypothesis:
  endpoint: "http://gateway:8088/health"
  max_error_rate_percent: 10.0
  max_p95_latency_ms: 1000.0
  probe_interval_seconds: 1.0
  consecutive_breaches_allowed: 2

rollback:
  auto_rollback: true
  recovery_action: "flush_iptables"
